<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Sections</title>

  <!-- Load jQuery first -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Then your custom JS -->
  <script src="main.js"></script>

  <body>
  <header>
    <h1 class="site-title"><a href="index.html">Jquery</a></h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="blog.html">Blog</a>
    </nav>
  </header>

  <style type="text/css">
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    section {
      width: 100%;
      height: 100vh;
    }

    p {
      font-family: Arial, sans-serif;
      font-size: 20px;
      text-align: center;
      padding-top: 40px;
      color: #fff;
    }

    .bg1 { background-color: #000; }
    .bg2 { background-color: #3a3a3a; }
    .bg3 { background-color: #686868; }
    .bg4 { background-color: #b89b9b; }
  </style>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section class="bg1">
    <p> section 1 </p>
  </section>

  <section class="bg2">
    <p> section 2 </p>
  </section>

  <section class="bg3" id="scroll-section3">
    <p> section 3 </p>
  </section>

  <section class="bg4" id="scroll-post">
    <p> Post </p>
  </section>
</body>
</html>
